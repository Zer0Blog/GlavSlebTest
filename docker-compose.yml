services:
  postgres:
    image: postgres:16-alpine
    container_name: glavsleb-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: glavsleb
      POSTGRES_PASSWORD: glavsleb
      POSTGRES_DB: glavsleb
    volumes:
      - glavsleb_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glavsleb -d glavsleb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  glavsleb_pg:
